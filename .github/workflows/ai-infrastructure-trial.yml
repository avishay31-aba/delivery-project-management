name: AI infrastructure trial
on:
  push:
    branches: [infra/ai-development-qa-bootstrap]
permissions:
  contents: read
concurrency:
  group: ai-infrastructure-trial
  cancel-in-progress: false
jobs:
  synthetic-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact HEAD
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deterministic harness
        run: python3 .github/ai-trial/trial.py --self-test
      - name: Check AI credential
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Configure repository secret OPENAI_API_KEY to enable the AI trial."
            exit 1
          fi
      - name: Install Codex
        run: npm install --global @openai/codex
      - name: Run isolated implementation and independent QA sessions
        run: python3 .github/ai-trial/trial.py
      - name: Verify repository stayed unchanged
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-trial-evidence
          path: ${{ runner.temp }}/dpm-ai-trial-evidence/
          if-no-files-found: warn
